          - B033
          - C099
          - LDN 100
          - LDN 108
          - LDN 11
          - LDN 111
          - LDN 1153
          - LDN 1166
          - LDN 1523
          - LDN 1682
          - LDN 1685
          - LDN 17
          - LDN 173
          - LDN 1746
          - LDN 323
          - LDN 42
          - LDN 530
          - LDN 557
          - LDN 582
          - LDN 617
          - LDN 66
          - LDN 889
          - LDN 935
          - LDN 99
  reference:
    inherit: deep
    include_uncertain_catalogue_matches: true
    catalogue_minimum_extent_arcmin:
      VII/20: 0
      VII/7A: 0
      VII/21: 0
      VII/220A: 0
      "VII/92A:Collinder": 0
      "VII/92A:Melotte": 0
      "VII/92A:Stock": 0
    included_catalogues:
      - OpenNGC
      - VII/20
      - VII/7A
      - VII/21
      - VII/220A
      - "VII/92A:Collinder"
      - "VII/92A:Melotte"
      - "VII/92A:Stock"
      - "IV/24:AbellPN"
      - "IV/24:CuratedPN"
      - "VII/202:Palomar"
      - "VII/202:Terzan"
