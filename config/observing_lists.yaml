# NightSky Atlas — observing-list selection policy.
#
# Membership data lives in vendored fixtures under
# data/fixtures/observing_lists/*.json (source and license per list in that
# directory).  Only lists that have a fixture contribute membership; the
# registry below documents the intended full set so typos in an edition policy
# are obvious.  Forced lists are always rendered regardless of magnitude;
# list_weights add to an object's render and label priority.

lists:
  messier:
    name: Messier
  herschel400:
    name: Herschel 400
  caldwell:
    name: Caldwell
  rasc_finest_ngc:
    name: RASC Finest NGC
  rasc_deep_sky_gems:
    name: RASC Deep-Sky Gems
  sac_best_110:
    name: SAC Best 110 NGC
  assa_top100:
    name: ASSA Top 100
  bennett:
    name: Bennett Catalogue
  nsog_best:
    name: Night Sky Observer's Guide Best Objects
  herschel2:
    name: Herschel II / Herschel 400 II
  planetary_nebula_al:
    name: Astronomical League Planetary Nebula Program
  nightsky_curated_pn:
    name: NightSkyAtlas curated planetary nebulae
  nightsky_pocket_classics:
    name: NightSkyAtlas Pocket visual classics
  nightsky_curated_bright_nebulae_v1:
    name: NightSkyAtlas curated bright nebulae v1
  nightsky_curated_dark_nebulae_v1:
    name: NightSkyAtlas curated dark nebulae v1
  nightsky_confirmed_abell_pn:
    name: NightSkyAtlas confirmed Abell planetary nebulae
  bright_nebula_al:
    name: Astronomical League Bright Nebula Program
  dark_nebula_al:
    name: Astronomical League Dark Nebula Program
  globular_cluster_al:
    name: Astronomical League Globular Cluster Program
  open_cluster_al:
    name: Astronomical League Open Cluster Program
  sac_beyond_ngc:
    name: SAC Beyond the NGC
  hickson:
    name: Hickson Compact Groups
  abell:
    name: Abell Galaxy Clusters

global_excluded_designations:
  - NGC1487 NED02
  - NGC4656 NED01
  - C014

editions:
  pocket:
    included_catalogues:
      - OpenNGC
      - "VII/155"
    forced_lists:
      - messier
      - caldwell
      - herschel400
      - nightsky_pocket_classics
    forced_list_reason_codes:
      messier: pocket_messier
      caldwell: pocket_caldwell
      herschel400: pocket_herschel400
      nightsky_pocket_classics: pocket_curated_visual_target
    selection_rules:
      open_cluster:
        use_visibility: false
        minimum_major_axis_arcmin: 20
        magnitude_size_gate_maximum_magnitude: 9.0
        magnitude_size_gate_minimum_major_axis_arcmin: 3.0
        selection_reason_code: open_cluster_pocket_policy
        exclusion_reason_code: open_cluster_pocket_policy_excluded
      globular_cluster:
        regional_allowlists:
          - id: lmc
            center_ra_deg: 80.894
            center_dec_deg: -69.756
            radius_deg: 6.5
            allowed_designations:
              - NGC1786
              - NGC1835
              - NGC1978
              - NGC2210
      galaxy:
        use_visibility: false
        minimum_visibility_score_by_aperture:
          100: -0.25
        minimum_major_axis_arcmin: 3.0
        selection_reason_code: pocket_galaxy_visibility_100mm
        exclusion_reason_code: pocket_below_100mm_visibility
    excluded_designations:
      - PGC025886
      - PGC 30484
      - PGC 46039
      - PGC 66669
      - PGC 71943
      - PGC 71948
      - ESO208-021
      - ESO221-026
      - ESO383-087
      - IC3322A
      - IC2605
      - IC3668
      - IC3669
  standard:
    included_catalogues:
      - OpenNGC
    forced_lists:
      - herschel400
      - nightsky_curated_bright_nebulae_v1
      - nightsky_curated_dark_nebulae_v1
    forced_list_reason_codes:
      herschel400: standard_herschel400
      nightsky_curated_bright_nebulae_v1: standard_curated_bright_nebula
      nightsky_curated_dark_nebulae_v1: standard_curated_dark_nebula
    list_weights:
      messier: 60
      herschel400: 50
      caldwell: 40
      rasc_finest_ngc: 35
      rasc_deep_sky_gems: 30
      nsog_best: 30
      sac_best_110: 25
      assa_top100: 25
      bennett: 25
    selection_rules:
      galaxy:
        use_visibility: false
        visibility_class_rules:
          - contour_class: bold
            minimum_major_axis_arcmin: 1.5
            bright_magnitude_fallback: 10.5
          - contour_class: normal
            minimum_major_axis_arcmin: 1.5
            bright_magnitude_fallback: 10.5
      galaxy_cluster:
        use_visibility: false
        selection_reason_code: group_standard_curated_only
        exclusion_reason_code: group_standard_curated_only
      open_cluster:
        use_visibility: false
        selection_reason_code: open_cluster_standard_policy
        minimum_major_axis_arcmin: 10
        magnitude_size_gate_maximum_magnitude: 10.0
        magnitude_size_gate_minimum_major_axis_arcmin: 3.0
        automatic_designation_prefixes: [NGC, IC]
        qualifying_memberships:
          - messier
          - caldwell
          - herschel400
          - rasc_finest_ngc
          - rasc_deep_sky_gems
          - nsog_best
          - sac_best_110
          - assa_top100
          - bennett
      globular_cluster:
        use_visibility: false
        selection_reason_code: globular_cluster_standard_policy
        maximum_magnitude: 12.5
        regional_allowlists:
          - id: lmc
            center_ra_deg: 80.894
            center_dec_deg: -69.756
            radius_deg: 6.5
            allowed_designations:
              - NGC1754
              - NGC1786
              - NGC1835
              - NGC1868
              - NGC1916
              - NGC1978
              - NGC2005
              - NGC2210
        qualifying_memberships:
          - messier
          - caldwell
          - herschel400
          - rasc_finest_ngc
          - rasc_deep_sky_gems
          - nsog_best
          - sac_best_110
          - assa_top100
          - bennett
  deep:
    inherit: standard
    included_catalogues:
      - OpenNGC
      - VII/20
      - VII/7A
      - VII/21
      - VII/220A
      - "VII/92A:Collinder"
      - "VII/92A:Melotte"
      - "VII/92A:Stock"
      - "IV/24:AbellPN"
      - "IV/24:CuratedPN"
      - "VII/202:Palomar"
      - "VII/202:Terzan"
      - VII/213
    # Source-size gates remain for catalogue families not covered by typed
    # selection rules below.
    catalogue_minimum_extent_arcmin:
      VII/20: 15
      VII/7A: 15
      VII/21: 90
      VII/220A: 15
    forced_lists:
      - herschel2
      - planetary_nebula_al
      - bright_nebula_al
      - dark_nebula_al
      - globular_cluster_al
      - open_cluster_al
    list_weights:
      sac_beyond_ngc: 25
      hickson: 20
      abell: 15
      nightsky_curated_pn: 10
      nightsky_confirmed_abell_pn: 10
    selection_rules:
      galaxy:
        use_visibility: false
        visibility_class_rules:
          - contour_class: bold
            minimum_major_axis_arcmin: 0.75
            bright_magnitude_fallback: 10.5
          - contour_class: normal
            minimum_major_axis_arcmin: 0.75
            bright_magnitude_fallback: 10.5
          - contour_class: fine
            minimum_major_axis_arcmin: 0.75
            bright_magnitude_fallback: 10.5
          - contour_class: dotted
            minimum_major_axis_arcmin: 0.5
            minimum_score_400: -1.0
      galaxy_cluster:
        use_visibility: true
        selection_reason_code: group_deep_policy
        qualifying_catalogues:
          - VII/213
        catalogue_minimum_member_count: 3
        catalogue_require_major_axis: true
      open_cluster:
        use_visibility: true
        visibility_catalogues:
          - OpenNGC
        selection_reason_code: open_cluster_deep_policy
        minimum_major_axis_arcmin: 10
        maximum_magnitude: 10.5
        magnitude_size_gate_maximum_magnitude: null
        magnitude_size_gate_minimum_major_axis_arcmin: null
        automatic_designation_prefixes: []
        qualifying_catalogues:
          - VII/92A:Collinder
          - VII/92A:Melotte
          - VII/92A:Stock
        catalogue_minimum_major_axis_arcmin: 3
        catalogue_maximum_magnitude: 11.5
      globular_cluster:
        use_visibility: true
        regional_allowlists:
          - id: lmc
            center_ra_deg: 80.894
            center_dec_deg: -69.756
            radius_deg: 6.5
            allowed_designations:
              - NGC1754
              - NGC1786
              - NGC1806
              - NGC1835
              - NGC1846
              - NGC1868
              - NGC1916
              - NGC1939
              - NGC1978
              - NGC2005
              - NGC2019
              - NGC2210
        selection_reason_code: globular_cluster_deep_policy
        qualifying_catalogues:
          - VII/202:Palomar
          - VII/202:Terzan
        catalogue_minimum_major_axis_arcmin: 0.01
        catalogue_maximum_magnitude: 99
      planetary_nebula:
        use_visibility: true
        curated_memberships:
          - nightsky_curated_pn
          - nightsky_confirmed_abell_pn
        maximum_magnitude: 14.5
        maximum_surface_brightness: 23.5
        selection_reason_code: planetary_nebula_deep_policy
        qualifying_catalogues:
          - IV/24:AbellPN
        catalogue_minimum_major_axis_arcmin: 0.01
        catalogue_maximum_magnitude: 14.5
        catalogue_maximum_surface_brightness: 23.5
      bright_nebula:
        use_visibility: true
        curated_memberships:
          - nightsky_curated_bright_nebulae_v1
        visibility_catalogues:
          - OpenNGC
          - VII/21
        selection_reason_code: bright_nebula_deep_size
        qualifying_catalogues:
          - VII/20
        catalogue_minimum_major_axis_arcmin: 15
      bright_nebula_unspecified:
        use_visibility: true
        curated_memberships:
          - nightsky_curated_bright_nebulae_v1
      supernova_remnant:
        use_visibility: true
        curated_memberships:
          - nightsky_curated_bright_nebulae_v1
      dark_nebula:
        use_visibility: false
        selection_reason_code: curated_dark_nebula_deep
        exclusion_reason_code: outside_curated_dark_nebula_set
