# Deep inherits the Standard print base; only edition geometry/content differs.
extends: standard.yaml
id: deep
edition: {name: Deep, code: D}
mm_per_degree: null
stellar_limit_magnitude: 10.0
# Ring tiling as Standard, at half the field: ring spacing 8 deg (Standard 16)
# and 22 rings from -84 to +84, staggered right ascension and stereographic
# polar caps.  Nominal overlap is half of Standard's (vertical 1.0 deg,
# horizontal min 0.75 deg), i.e. the same fraction of the field.  Counts are the
# frozen minimum that passes the 0.5 deg coverage sweep plus the horizontal
# overlap target.
tiling:
  width_deg: 13.5
  height_deg: 9.0
  coverage_step_deg: 0.5
  declination_centers: [-84.0, -76.0, -68.0, -60.0, -52.0, -44.0, -36.0, -28.0, -20.0, -12.0, -4.0, 4.0, 12.0, 20.0, 28.0, 36.0, 44.0, 52.0, 60.0, 68.0, 76.0, 84.0]
  chart_counts: [5, 10, 13, 15, 18, 21, 23, 25, 27, 28, 29, 29, 28, 27, 25, 23, 21, 18, 15, 13, 10, 5]
  polar_caps: true
  stagger_ra_centers: true
  auto_adjust_counts: false
  target_overlap:
    vertical_deg: 1.0
    horizontal_min_deg: 0.75
visibility:
  # Deep renders every genuine deep-sky object in OpenNGC, not just the
  # per-type visible subset.  ``star``/``double_star`` catalogue entries are
  # still excluded (they are not drawn as deep-sky symbols).
  include_all: true
  integrated_magnitude_limit: 14.5
  surface_brightness_limit: 24.5
  min_axis_arcmin: 0.8
  bright_magnitude_limit: 12.0
  reference_magnitude: 8.5
  reference_surface_brightness: 21.5
  reference_axis_arcmin: 6.0
