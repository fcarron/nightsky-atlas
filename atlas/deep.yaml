# Experimental aligned tiling: 23 symmetric declination rings, with small
# shifts at ±53° and ±83° to improve the weakest sampled edge margin and polar
# overlap. RA starts at 0° in every ring; see docs/CARTOGRAPHY.md.
tiling:
  width_deg: 13.5
  height_deg: 9.0
  coverage_step_deg: 0.25
  declination_centers: [-83.0, -75.0, -67.5, -60.0, -53.0, -45.0, -37.5, -30.0, -22.5, -15.0, -7.5, 0.0, 7.5, 15.0, 22.5, 30.0, 37.5, 45.0, 53.0, 60.0, 67.5, 75.0, 83.0]
  chart_counts: [5, 10, 15, 15, 20, 25, 25, 25, 30, 30, 30, 30, 30, 30, 30, 25, 25, 25, 20, 15, 15, 10, 5]
  polar_caps: true
  stagger_ra_centers: false
  ra_offset_deg: 0.0
  auto_adjust_counts: false
  target_overlap:
    vertical_deg: 1.5
    horizontal_min_deg: 1.0
visibility:
  # Deep renders every genuine deep-sky object in OpenNGC, not just the
  # per-type visible subset.  ``star``/``double_star`` catalogue entries are
  # still excluded (they are not drawn as deep-sky symbols).
  include_all: true
  integrated_magnitude_limit: 14.5
  surface_brightness_limit: 24.5
  min_axis_arcmin: 0.8
  bright_magnitude_limit: 12.0
  reference_magnitude: 8.5
  reference_surface_brightness: 21.5
  reference_axis_arcmin: 6.0
