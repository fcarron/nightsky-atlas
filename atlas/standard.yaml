# NightSky Atlas — Standard edition definition.
#
# Content and tiling only; visual appearance lives in styles/standard.yaml.
# Chart definitions are explicitly listed at this milestone.  Automatic tiling
# is not implemented yet.

id: standard
chart_directory_position: back

# Normative print scale; the page frame is centered around this exact map field.
mm_per_degree: 10.0

# Visible edition identity.  Internal ids stay long (standard-068); the printed
# atlas shows the edition name and short chart code (Standard, S068).
edition:
  name: Standard
  code: S

# Provisional standard-edition stellar limiting magnitude (chosen at M4.3).
stellar_limit_magnitude: 9.0

# Standard v0.3 uses explicit declination rings with polar caps, RA staggering
# and numeric coverage validation.  The counts are the *frozen* minimum that
# passes a 0.25 deg coverage sweep and are mirror-symmetric north/south so the
# two hemispheres pair chart-for-chart (10/9/12/13/14 per hemisphere, 118
# charts including the two polar caps); see docs/CARTOGRAPHY.md.
# auto_adjust_counts is off because the conservative per-ring resolver would
# demand 10 charts in the outer (-56/+56) rings too, while the assembled
# tiling covers with the counts below.
tiling:
  width_deg: 27.0
  height_deg: 18.5
  coverage_step_deg: 0.5
  declination_centers: [-72.0, -56.0, -40.0, -24.0, -8.0, 8.0, 24.0, 40.0, 56.0, 72.0]
  chart_counts: [10, 9, 12, 13, 14, 14, 13, 12, 9, 10]
  polar_caps: true
  stagger_ra_centers: true
  auto_adjust_counts: false
  target_overlap:
    vertical_deg: 2.0
    horizontal_min_deg: 1.5

# Per-type deep-sky visibility limits.  Target: an 8-10 inch instrument under a
# dark sky.  Galaxies are surface-brightness limited; clusters and planetary
# nebulae use magnitude and size; tiny faint objects are dropped unless bright
# or forced by an observing list.
visibility:
  integrated_magnitude_limit: 13.5
  surface_brightness_limit: 23.5
  min_axis_arcmin: 1.5
  bright_magnitude_limit: 10.5
  reference_magnitude: 8.0
  reference_surface_brightness: 21.0
  reference_axis_arcmin: 10.0

