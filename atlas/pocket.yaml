# Pocket inherits the Standard print base; only edition geometry/content differs.
extends: standard.yaml
id: pocket
edition: {name: Pocket, code: P, chart_index_width: 2}
chart_directory_position: back
mm_per_degree: 5.0
stellar_limit_magnitude: 7.5
exclude_star_labels: [17702, 17847] # HIP 17702 Alcyone; HIP 17847 Atlas
detail_charts:
  - id: pocket-detail-virgo-core
    code: PD01
    name: Virgo core
    center_ra_deg: 186.75
    center_dec_deg: 13.0
    width_deg: 13.0
    height_deg: 8.5
    mm_per_degree: 20.0
    star_profile: deep
    dso_profile: deep
    parent_marker_label: ""
  - id: pocket-detail-pleiades
    code: PD02
    name: Pleiades · M45
    center_ra_deg: 56.75
    center_dec_deg: 24.1167
    width_deg: 6.5
    height_deg: 4.25
    mm_per_degree: 40.0
    star_profile: eyepiece
    dso_profile: eyepiece
    stars:
      magnitude_limit: 11.25
      include_ucac4: true
      named_labels: [17489, 17499, 17531, 17573, 17608, 17702, 17847, 17851]
    show_constellation_names: false
    objects:
      Mel022:
        show_symbol: false
        show_label: true
  - id: pocket-detail-orion-m42
    code: PD03
    name: Orion Nebula · M42
    center_ra_deg: 83.822
    center_dec_deg: -5.391
    width_deg: 13.0
    height_deg: 8.5
    mm_per_degree: 20.0
    star_profile: deep
    dso_profile: deep
  - id: pocket-detail-sagittarius-m8-m20
    code: PD04
    name: Lagoon and Trifid Nebulae · M8 / M20
    center_ra_deg: 270.8
    center_dec_deg: -24.0
    width_deg: 13.0
    height_deg: 8.5
    mm_per_degree: 20.0
    star_profile: deep
    dso_profile: deep
tiling:
  width_deg: 54.0
  height_deg: 36.0
  target_overlap_mm: 10.0
  mm_per_degree: 5.0
  coverage_step_deg: 0.25
  declination_centers: [-62.0, -33.0, 0.0, 33.0, 62.0]
  chart_counts: [5, 9, 9, 9, 5]
  polar_caps: true
  stagger_ra_centers: false
  auto_adjust_counts: false
visibility:
  integrated_magnitude_limit: 11.5
  surface_brightness_limit: 22.5
  min_axis_arcmin: 3.0
  bright_magnitude_limit: 9.0
  reference_magnitude: 7.5
  reference_surface_brightness: 20.5
  reference_axis_arcmin: 15.0
