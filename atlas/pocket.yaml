# Pocket inherits the Standard print base; only edition geometry/content differs.
extends: standard.yaml
id: pocket
edition: {name: Pocket, code: P, chart_index_width: 2}
chart_directory_position: back
mm_per_degree: 5.0
stellar_limit_magnitude: 7.5
detail_charts:
  - id: pocket-detail-virgo-core
    code: PD021A
    name: Virgo core
    parent_chart_id: pocket-021
    center_ra_deg: 186.75
    center_dec_deg: 13.0
    width_deg: 27.0
    height_deg: 18.5
    mm_per_degree: 10.0
    star_profile: standard
    fallback_parent_galaxy_labels: true
    parent_marker_label: ""
tiling:
  width_deg: 54.0
  height_deg: 36.0
  target_overlap_mm: 10.0
  mm_per_degree: 5.0
  coverage_step_deg: 0.25
  declination_centers: [-62.0, -33.0, 0.0, 33.0, 62.0]
  chart_counts: [5, 9, 9, 9, 5]
  polar_caps: true
  stagger_ra_centers: false
  auto_adjust_counts: false
visibility:
  integrated_magnitude_limit: 11.5
  surface_brightness_limit: 22.5
  min_axis_arcmin: 3.0
  bright_magnitude_limit: 9.0
  reference_magnitude: 7.5
  reference_surface_brightness: 20.5
  reference_axis_arcmin: 15.0
