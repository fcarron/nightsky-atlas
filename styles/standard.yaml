# NightSky Atlas — Standard rendering style.
#
# Appearance only; chart geometry and content live in atlas/standard.yaml.

id: standard

star:
  min_diameter_mm: 0.36
  max_diameter_mm: 6.0
  bright_magnitude: 0.0
  faint_magnitude: 9.0
  label_magnitude_limit: 5.5
  # A faint star overlapping a brighter star is redrawn above it with this
  # physical white knockout ring, retaining both real positions.
  close_overlap_halo_mm: 0.12
  diameter_curve: [[0.0, 6.0], [1.0, 5.0], [2.0, 4.2], [3.0, 3.15], [4.0, 2.4], [5.0, 1.65], [6.0, 1.1], [7.0, 0.78], [8.0, 0.58], [9.0, 0.36]]

label:
  font_family: "DejaVu Sans"
  font_size_pt: 6.0
  star_labels:
    proper_names: {core: true, standard: true, extended: false}
    bayer: {enabled: true, max_magnitude: 5.5}
    flamsteed: {enabled: true, max_magnitude: 5.0}
    variables: {enabled: true, max_magnitude: 6.5}
    combined_names: true
    constellation_suffix: {default: false, allow_ambiguity_fallback: true}
  candidate_rings: 3
  ring_gap_mm: 3.0
  leader_lines:
    enabled: true
    auto_min_ring: 2
    min_length_mm: 2.5
    max_length_mm: 12.0
    symbol_gap_mm: 0.25
    label_gap_mm: 0.4
    width_mm: 0.12
    gray: 0.4
  # Faint selected objects are drawn but not labelled (Messier, common names,
  # bright DSOs and observing-list members are exempt).
  dso_label_magnitude_limit: 12.5
  # Deep-sky label hierarchy.  The catalogue prefix is dropped for NGC (a bare
  # number means NGC); Messier is bold and larger, Herschel 400 is bold.
  dso_labels:
    normal_size_pt: 6.5
    messier:
      size_factor: 1.15
      weight: bold
    herschel400:
      size_factor: 1.0
      weight: bold
    normal:
      size_factor: 1.0
      weight: normal
  # Deterministic selection before placement.  A drawn object is not
  # necessarily a labelled object: high-priority labels (Messier, prominent
  # Herschel 400, named stars) always survive, while medium/low labels are
  # thinned by *local* printed-label density so crowded fields (Virgo) stay
  # readable and sparse fields keep their labels.  This is never a global
  # percentage.
  selection:
    enabled: true
    density_radius_mm: 15.0
    medium_density_budget: 0.12
    low_density_budget: 0.05
    # A rendered galaxy is an observing target, not anonymous chart texture.
    # It still remains optional for collision repair if every placement fails.
    always_label_object_types: [galaxy]

dso:
  line_width_mm: 0.15
  # Heavier stroke for emphasized symbols (Messier, Herschel 400), matching
  # those objects' bold labels.
  bold_line_width_mm: 0.3
  dash_mm: 0.4
  outline_line_width_mm: 0.18
  outline_dash_mm: 0.8
  outline_gray: 0.45
  # Only compact DSO symbols receive a white knockout near a bright star.
  # Clearing an extended nebula's full extent would erase the stars inside it.
  star_overlap_halo_mm: 0.12
  star_overlap_magnitude_limit: 4.5
  star_overlap_knockout_max_diameter_mm: 3.0
  # Per-class symbol extent.  Extended classes use the catalogue angular size
  # (scaled by the chart's mm-per-degree) when available; fallback_diameter_mm
  # covers missing/unreliable sizes, min_diameter_mm keeps small marks
  # printable and max_diameter_mm caps only genuinely chart-dominating fields.
  # Galaxies preserve
  # their axis ratio and position angle; the diameters act on the major axis.
  galaxy:
    use_angular_size: true
    fallback_diameter_mm: 1.4
    min_diameter_mm: 0.7
    min_minor_axis_mm: 1.2
    max_diameter_mm: 60.0
  globular_cluster:
    use_angular_size: true
    fallback_diameter_mm: 1.5
    min_diameter_mm: 1.4
    max_diameter_mm: 20.0
  open_cluster:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 1.8
    max_diameter_mm: 30.0
  planetary_nebula:
    use_angular_size: true
    fallback_diameter_mm: 1.4
    min_diameter_mm: 1.4
    max_diameter_mm: 12.0
  bright_nebula:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 2.0
  dark_nebula:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 2.0
  galaxy_cluster:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 2.0
  other:
    fallback_diameter_mm: 1.4
    min_diameter_mm: 1.0

# Visual double/multiple stars (WDS overlay).  A pair is drawn as one symbol
# plus a short horizontal marker only when its components cannot be separated on
# the page, i.e. their printed separation is below min_component_separation_mm.
# The marker scales with the printed star (marker_length_factor x diameter,
# floored at min_marker_length_mm).  companion_magnitude_limit keeps the chart
# selective: companions fainter than this are not marked unless they are
# actually plotted.  The marker is a map symbol, not the real position angle.
double_stars:
  enabled: true
  min_component_separation_mm: 0.7
  marker_length_factor: 1.8
  min_marker_length_mm: 0.8
  marker_line_width_mm: 0.15
  companion_magnitude_limit: 9.0

constellation:
  lines:
    enabled: true
    gray: 0.5
    line_width_mm: 0.16
    bold_width_mm: 0.23
    normal_width_mm: 0.16
    thin_width_mm: 0.11
    star_gap_extra_mm: 0.2
  boundaries:
    enabled: true
    gray: 0.82
    line_width_mm: 0.1
    dash_mm: 0.5
    gap_mm: 1.0

grid:
  enabled: true
  ra_step_deg: 2.0
  dec_step_deg: 2.0
  polar_ra_step_deg: 10.0
  line_width_mm: 0.1
  gray: 0.8
  labels_enabled: true
  label_placement: outside
  label_font_size_pt: 5.0
  label_gray: 0.35
  label_padding_mm: 1.5
  # Coordinate *labels* are deliberately sparser than the grid *lines*: a label
  # every second line (label_*_step_deg = 4 deg vs 2 deg lines), and the
  # renderer additionally skips any label that would sit closer than
  # label_min_spacing_mm to its neighbour on the same page edge.
  label_min_spacing_mm: 13.0
  # On polar charts the meridian fan is dense near the frame edge; RA labels
  # are thinned to every 30 deg (the grid itself stays at polar_ra_step_deg).
  label_polar_ra_step_deg: 30.0
  label_ra_step_deg: 4.0
  label_dec_step_deg: 4.0

ecliptic:
  enabled: true
  line_width_mm: 0.12
  gray: 0.62
  dash_mm: 0.8
  gap_mm: 0.8

furniture:
  title_font_size_pt: 8.5
  title_gray: 0.15
  chart_border_width_mm: 0.25
  # Angular scale: thin, mid-grey and quiet.  A per-edition angular value keeps
  # the printed bar roughly 40-50 mm long whatever the chart scale.
  scale_bar:
    enabled: true
    length_deg: 5.0
    thickness_mm: 0.13
    gray: 0.5
    font_size_pt: 6.5
    tick_mm: 1.2
  # Adjacent-chart navigation, outside the coordinate labels and always with
  # short visible codes (S068), never internal ids.  The chart code is bold and
  # the reference is larger than before so it can be found while flipping
  # pages; E/W are rotated along the narrow side margin.  E/W sit
  # side_inset_mm from the paper edge (print-safe), N/S frame_gap_mm outside
  # the chart frame.
  navigation:
    enabled: true
    font_size_pt: 7.5
    gray: 0.5
    frame_gap_mm: 3.8
    side_inset_mm: 5.0
  # Compact magnitude reference using the real star size model.
  magnitude_legend:
    enabled: true
    font_size_pt: 5.5
    gray: 0.55
    spacing_mm: 6.0
    label: "mag"

# Front-of-atlas whole-sky overview pages: a pole-centred azimuthal equidistant
# disk per hemisphere showing a simplified constellation background, the bright
# stars, and one clean trapezoidal ring/RA-sector cell per Standard chart (no
# overlapping chart fields) with the printed chart code (S001, ...) at each cell
# centre.  Appearance only; geometry comes from the atlas tiling.
overview:
  enabled: true
  radius_mm: 76.0
  show_stars: true
  star_limit_magnitude: 5.0
  star_min_diameter_mm: 0.3
  star_max_diameter_mm: 1.4
  star_bright_magnitude: 0.0
  star_faint_magnitude: 5.0
  star_gray: 0.0

# Optional per-chart locator inset: a compact version of the hemisphere
# overview drawn in a chart corner, with the current footprint emphasized and
# its immediate neighbours highlighted.  Disabled by default.
locator:
  enabled: false
  diameter_mm: 42.0
  corner: bottom_left
  show_neighbours: true
