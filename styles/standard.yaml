# NightSky Atlas — Standard rendering style.
#
# Appearance only; chart geometry and content live in atlas/standard.yaml.

id: standard

star:
  min_diameter_mm: 0.2
  max_diameter_mm: 2.4
  bright_magnitude: 0.0
  faint_magnitude: 9.0
  label_magnitude_limit: 5.5

label:
  font_family: "DejaVu Sans"
  font_size_pt: 6.0
  candidate_rings: 3
  ring_gap_mm: 3.0
  # Faint selected objects are drawn but not labelled (Messier, common names,
  # bright DSOs and observing-list members are exempt).
  dso_label_magnitude_limit: 12.5
  # Deep-sky label hierarchy.  The catalogue prefix is dropped for NGC (a bare
  # number means NGC); Messier is bold and larger, Herschel 400 is bold.
  dso_labels:
    normal_size_pt: 6.5
    messier:
      size_factor: 1.15
      weight: bold
    herschel400:
      size_factor: 1.0
      weight: bold
    normal:
      size_factor: 1.0
      weight: normal

dso:
  line_width_mm: 0.15
  # Heavier stroke for emphasized symbols (Messier, Herschel 400), matching
  # those objects' bold labels.
  bold_line_width_mm: 0.3
  dash_mm: 0.4
  outline_line_width_mm: 0.18
  outline_dash_mm: 0.8
  outline_gray: 0.45
  # Per-class symbol extent.  Extended classes use the catalogue angular size
  # (scaled by the chart's mm-per-degree) when available; fallback_diameter_mm
  # covers missing/unreliable sizes, min_diameter_mm keeps small marks
  # printable and max_diameter_mm caps genuinely huge fields.  Galaxies preserve
  # their axis ratio and position angle; the diameters act on the major axis.
  galaxy:
    use_angular_size: true
    fallback_diameter_mm: 1.4
    min_diameter_mm: 0.7
    max_diameter_mm: 12.0
  globular_cluster:
    use_angular_size: true
    fallback_diameter_mm: 1.5
    min_diameter_mm: 1.2
    max_diameter_mm: 20.0
  open_cluster:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 1.4
    max_diameter_mm: 30.0
  planetary_nebula:
    fallback_diameter_mm: 1.4
    min_diameter_mm: 1.0
  bright_nebula:
    fallback_diameter_mm: 1.6
    min_diameter_mm: 1.2
  dark_nebula:
    fallback_diameter_mm: 1.6
    min_diameter_mm: 1.2
  galaxy_cluster:
    fallback_diameter_mm: 1.6
    min_diameter_mm: 1.2
  other:
    fallback_diameter_mm: 1.4
    min_diameter_mm: 1.0

# Visual double/multiple stars (WDS overlay).  A pair is drawn as one symbol
# plus a short horizontal marker only when its components cannot be separated on
# the page, i.e. their printed separation is below min_component_separation_mm.
# The marker scales with the printed star (marker_length_factor x diameter,
# floored at min_marker_length_mm).  companion_magnitude_limit keeps the chart
# selective: companions fainter than this are not marked unless they are
# actually plotted.  The marker is a map symbol, not the real position angle.
double_stars:
  enabled: true
  min_component_separation_mm: 0.7
  marker_length_factor: 1.8
  min_marker_length_mm: 0.8
  marker_line_width_mm: 0.15
  companion_magnitude_limit: 9.0

constellation:
  lines:
    enabled: true
    gray: 0.5
    line_width_mm: 0.22
    star_gap_extra_mm: 0.2
  boundaries:
    enabled: true
    gray: 0.82
    line_width_mm: 0.1
    dash_mm: 0.5
    gap_mm: 1.0

grid:
  enabled: true
  ra_step_deg: 2.0
  dec_step_deg: 2.0
  polar_ra_step_deg: 10.0
  line_width_mm: 0.1
  gray: 0.8
  labels_enabled: true
  label_placement: outside
  label_font_size_pt: 5.0
  label_gray: 0.35
  label_padding_mm: 1.5
  # Coordinate *labels* are deliberately sparser than the grid *lines*: a label
  # every second line (label_*_step_deg = 4 deg vs 2 deg lines), and the
  # renderer additionally skips any label that would sit closer than
  # label_min_spacing_mm to its neighbour on the same page edge.
  label_min_spacing_mm: 13.0
  # On polar charts the meridian fan is dense near the frame edge; RA labels
  # are thinned to every 30 deg (the grid itself stays at polar_ra_step_deg).
  label_polar_ra_step_deg: 30.0
  label_ra_step_deg: 4.0
  label_dec_step_deg: 4.0

furniture:
  title_font_size_pt: 9.0
  scale_font_size_pt: 6.0
  scale_bar_length_deg: 5.0
  scale_bar_thickness_mm: 0.4
  chart_border_width_mm: 0.25
