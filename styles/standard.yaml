# NightSky Atlas — Standard rendering style.
#
# Appearance only; chart geometry and content live in atlas/standard.yaml.

id: standard

star:
  min_diameter_mm: 0.36
  max_diameter_mm: 6.0
  bright_magnitude: 0.0
  faint_magnitude: 9.0
  label_magnitude_limit: 5.5
  # A faint star overlapping a brighter star is redrawn above it with this
  # physical white knockout ring, retaining both real positions.
  close_overlap_halo_mm: 0.12
  diameter_curve: [[0.0, 6.0], [1.0, 5.0], [2.0, 4.2], [3.0, 3.15], [4.0, 2.4], [5.0, 1.65], [6.0, 1.1], [7.0, 0.78], [8.0, 0.58], [9.0, 0.36]]

label:
  font_family: "DejaVu Sans"
  font_size_pt: 6.0
  star_labels:
    proper_names: {core: true, standard: true, extended: false}
    bayer: {enabled: true, max_magnitude: 5.5}
    flamsteed: {enabled: true, max_magnitude: 5.0}
    variables: {enabled: true, max_magnitude: 6.5}
    combined_names: true
    proper_names_always_visible: true
    proper_name_candidate_rings: 3
    candidate_ring_gap_mm: 0.75
    constellation_suffix: {default: false, allow_ambiguity_fallback: true}
  candidate_rings: 3
  ring_gap_mm: 3.0
  star_clearance:
    foreign: {hard_min_mm: 0.05, hard_radius_mm: 0.75, soft_clear_mm: 0.35, radius_clearance_factor: 1.0, importance_reference_radius_mm: 0.6, maximum_importance: 2.0, weight: 10.0}
    associated: {hard_min_mm: 0.35, soft_clear_mm: 0.45, preferred_min_mm: 0.45, clearance_weight: 8.0, preferred_max_mm: 0.75, distance_weight: 30.0}
  source_association:
    preferred_min_gap_mm: 0.35
    preferred_max_gap_mm: 1.0
    distance_weight: 12.0
    corridor_margin_mm: 0.25
    corridor_weight: 18.0
    ambiguity_margin_mm: 0.75
    ambiguity_weight: 20.0
    competing_owner_weight: 26.0
    foreign_object_clear_mm: 0.8
    foreign_object_weight: 8.0
    glyph_clear_mm: 0.75
    glyph_inline_factor: 5.0
    whitespace_factor: 1.5
    glyph_weight: 120.0
    compact_label_factor: 1.35
  dso_placement:
    candidate_edge_gaps_mm: [0.35, 0.55, 0.8, 1.1, 1.5, 2.0, 3.0, 4.5, 6.0]
    candidate_directions: 16
    outer_candidate_directions: 8
    outer_candidate_start_gap_mm: 3.0
    preferred_max_gap_mm: 0.8
    long_gap_knee_mm: 1.2
    long_gap_curve_factor: 2.5
    direct_gap_expensive_mm: 1.8
    direct_gap_extra_weight: 8.0
    ownership_margin_preferred_mm: 0.75
    ownership_margin_hard_limit_mm: 0.0
    ownership_margin_weight: 48.0
    compact_label_factor: 1.35
    label_label_ink_clearance_mm: 0.2
    joint_max_component_labels: 8
    joint_beam_width: 24
    joint_node_budget: 24000
    hard_repair_neighborhood_labels: 6
    hard_repair_search_limit: 45
  leader_lines:
    enabled: true
    auto_min_ring: 2
    star_ambiguity_threshold: 4.0
    dso_ambiguity_threshold: 2.5
    dso_min_length_mm: 0.75
    dso_preferred_gap_mm: 2.5
    dso_length_weight: 4.0
    dso_association_residual_factor: 0.10
    min_length_mm: 2.5
    max_length_mm: 12.0
    symbol_gap_mm: 0.25
    label_gap_mm: 0.4
    width_mm: 0.08
    gray: 0.55
  dso_label_magnitude_limit: null
  # Deep-sky label hierarchy.  The catalogue prefix is dropped for NGC (a bare
  # number means NGC); Messier and Herschel 400 are bold, all label sizes equal.
  dso_labels:
    normal_size_pt: 6.5
    messier:
      size_factor: 1.0
      weight: bold
    herschel400:
      size_factor: 1.0
      weight: bold
    normal:
      size_factor: 1.0
      weight: normal
  selection:
    enabled: true
    density_radius_mm: 15.0
    medium_density_budget: 0.12
    low_density_budget: 0.05
    dso_medium_density_budget: 0.35
    dso_low_density_budget: 0.25
    dso_dense_start_neighbors: 6
    dso_dense_full_neighbors: 12
    always_label_object_types: [galaxy]

dso:
  line_width_mm: 0.15
  # Heavier stroke for emphasized symbols (Messier, Herschel 400), matching
  # those objects' bold labels.
  bold_line_width_mm: 0.3
  dash_mm: 0.4
  outline_line_width_mm: 0.18
  outline_dash_mm: 0.8
  outline_gray: 0.45
  # Only compact DSO symbols receive a white knockout near a bright star.
  # Clearing an extended nebula's full extent would erase the stars inside it.
  star_overlap_halo_mm: 0.12
  star_overlap_magnitude_limit: 4.5
  star_overlap_knockout_max_diameter_mm: 3.0
  # Per-class symbol extent.  Extended classes use the catalogue angular size
  # (scaled by the chart's mm-per-degree) when available; fallback_diameter_mm
  # covers missing/unreliable sizes, min_diameter_mm keeps small marks
  # printable and max_diameter_mm caps only genuinely chart-dominating fields.
  # Galaxies preserve
  # their axis ratio and position angle; the diameters act on the major axis.
  galaxy:
    use_angular_size: true
    fallback_diameter_mm: 1.4
    min_diameter_mm: 0.7
    min_angular_major_axis_arcmin: 10.0
    max_diameter_mm: 60.0
  globular_cluster:
    use_angular_size: true
    fallback_diameter_mm: 1.5
    min_diameter_mm: 1.4
    min_angular_size_arcmin: 10.0
    max_diameter_mm: 20.0
  open_cluster:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 1.8
    min_angular_size_arcmin: 10.0
    max_diameter_mm: 30.0
  planetary_nebula:
    use_angular_size: true
    fallback_diameter_mm: 1.4
    min_diameter_mm: 1.4
    min_angular_size_arcmin: 10.0
    max_diameter_mm: 12.0
  bright_nebula:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 2.0
    min_angular_size_arcmin: 10.0
  dark_nebula:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 2.0
    min_angular_size_arcmin: 10.0
  galaxy_cluster:
    use_angular_size: true
    fallback_diameter_mm: 2.0
    min_diameter_mm: 2.0
    min_angular_size_arcmin: 10.0
  other:
    fallback_diameter_mm: 1.4
    min_diameter_mm: 1.0
  # Galaxy contour stroke by Crumey visibility class (see
  # docs/GALAXY_VISIBILITY.md).  The class sets the contour weight
  # independently of the label hierarchy: a galaxy may carry a bold Herschel
  # 400 label and still print a fine contour.  `dotted` uses a short dash
  # rather than isolated dots so small symbols stay visible in the PDF;
  # `unclassified` keeps the neutral `line_width_mm` fallback above.
  galaxy_contours:
    bold: {line_width_mm: 0.176}
    normal: {line_width_mm: 0.106}
    fine: {line_width_mm: 0.071}
    dotted: {line_width_mm: 0.088, dash_mm: 0.4, gap_mm: 0.35}

# WDS selection is profile-specific; map representation is based on actual
# projected component centres and rendered stellar symbol radii.
double_stars:
  enabled: true
  limits:
    - {max_sep_arcsec: 30, max_secondary_mag: 11.5}
    - {max_sep_arcsec: 120, max_secondary_mag: 10.0}
    - {max_sep_arcsec: 200, max_secondary_mag: 9.0}
  delta_mag_limits:
    - {max_sep_arcsec: 2, max_delta_mag: 3}
    - {max_sep_arcsec: 5, max_delta_mag: 5}
  unresolved_clearance_mm: 0.15
  marginal_clearance_mm: 0.8
  marker_length_factor: 1.8
  min_marker_length_mm: 0.8
  marker_line_width_mm: 0.15

variable_stars:
  enabled: true
  ring_gap_mm: 0.18
  line_width_mm: 0.10
  gray: 0.0

constellation:
  lines:
    enabled: true
    gray: 0.56
    line_width_mm: 0.16
    bold_width_mm: 0.25
    normal_width_mm: 0.16
    thin_width_mm: 0.10
    star_gap_extra_mm: 0.2
  boundaries:
    enabled: true
    gray: 0.82
    line_width_mm: 0.1
    dash_mm: 0.5
    gap_mm: 1.0
  names:
    font_size_pt: 10.2

grid:
  enabled: true
  ra_step_deg: 7.5
  dec_step_deg: 5.0
  polar_ra_step_deg: 7.5
  line_width_mm: 0.1
  gray: 0.8
  polar_ra_line_width_mm: 0.08
  polar_ra_gray: 0.87
  labels_enabled: true
  label_placement: outside
  label_font_size_pt: 5.0
  label_gray: 0.35
  label_padding_mm: 1.5
  # Coordinate labels are deliberately sparser than the grid lines: every
  # second line, with additional thinning when labels would crowd along an edge.
  label_min_spacing_mm: 13.0
  # On polar charts the meridian fan is dense near the frame edge; RA labels
  # are thinned to every 30 deg (the grid itself stays at polar_ra_step_deg).
  label_polar_ra_step_deg: 30.0
  label_ra_step_deg: 15.0
  label_dec_step_deg: 10.0

ecliptic:
  enabled: true
  line_width_mm: 0.12
  gray: 0.62
  dash_mm: 0.8
  gap_mm: 0.8

furniture:
  title_font_size_pt: 8.5
  title_gray: 0.15
  chart_border_width_mm: 0.25
  # Angular scale: thin, mid-grey and quiet.  A per-edition angular value keeps
  # the printed bar roughly 40-50 mm long whatever the chart scale.
  scale_bar:
    enabled: true
    length_deg: 5.0
    thickness_mm: 0.13
    gray: 0.5
    font_size_pt: 6.5
    tick_mm: 1.2
  # Adjacent-chart navigation, outside the coordinate labels and always with
  # short visible codes (S068), never internal ids.  The chart code is bold and
  # the reference is larger than before so it can be found while flipping
  # pages; E/W are rotated along the narrow side margin.  E/W sit
  # side_inset_mm from the paper edge (print-safe), N/S frame_gap_mm outside
  # the chart frame.
  navigation:
    enabled: true
    font_size_pt: 7.5
    gray: 0.5
    frame_gap_mm: 3.8
    side_inset_mm: 5.0
  # Compact magnitude reference using the real star size model.
  magnitude_legend:
    enabled: false
    font_size_pt: 5.5
    gray: 0.0
    spacing_mm: 3.5
    label: "stars to mag"

# Front-of-atlas whole-sky overview pages: a pole-centred azimuthal equidistant
# disk per hemisphere showing a simplified constellation background, the bright
# stars, and one clean trapezoidal ring/RA-sector cell per Standard chart (no
# overlapping chart fields) with the printed chart code (S001, ...) at each cell
# centre.  Appearance only; geometry comes from the atlas tiling.
overview:
  enabled: true
  radius_mm: 76.0
  code_font_size_pt: 5.25
  show_stars: true
  star_limit_magnitude: 5.0
  star_min_diameter_mm: 0.3
  star_max_diameter_mm: 1.4
  star_bright_magnitude: 0.0
  star_faint_magnitude: 5.0
  star_gray: 0.0

# Optional per-chart locator inset: a compact version of the hemisphere
# overview drawn in a chart corner, with the current footprint emphasized and
# its immediate neighbours highlighted.  Disabled by default.
locator:
  enabled: false
  diameter_mm: 42.0
  corner: bottom_left
  show_neighbours: true
