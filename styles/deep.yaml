# Shared physical print style inherited from Standard; Deep alters only content density.
extends: standard.yaml
id: deep
star:
  faint_magnitude: 10.0
  label_magnitude_limit: 6.5
  min_diameter_mm: 0.35
  max_diameter_mm: 7.0
  diameter_curve: [[0.0, 7.0], [1.0, 5.9], [2.0, 4.9], [3.0, 4.0], [4.0, 3.2], [5.0, 2.5], [6.0, 1.85], [7.0, 1.3], [8.0, 0.9], [9.0, 0.6], [10.0, 0.35]]
double_stars:
  limits:
    - {max_sep_arcsec: 30, max_secondary_mag: 13.0}
    - {max_sep_arcsec: 120, max_secondary_mag: 11.5}
    - {max_sep_arcsec: 300, max_secondary_mag: 10.0}
  marker_length_factor: 1.6
  min_marker_length_mm: 0.7
  marker_line_width_mm: 0.12
dso:
  galaxy: {min_angular_major_axis_arcmin: 5.0}
  globular_cluster: {min_angular_size_arcmin: 5.0, min_diameter_mm: 1.1}
  open_cluster: {min_angular_size_arcmin: 5.0, min_diameter_mm: 1.4}
  planetary_nebula: {min_angular_size_arcmin: 5.0, min_diameter_mm: 1.1}
  bright_nebula: {use_angular_size: false, min_diameter_mm: 1.6}
  dark_nebula: {use_angular_size: false, min_diameter_mm: 1.6}
  galaxy_cluster: {min_angular_size_arcmin: 5.0, min_diameter_mm: 1.6}
grid:
  ra_step_deg: 3.75
  dec_step_deg: 2.0
  polar_ra_step_deg: 3.75
  label_ra_step_deg: 7.5
  label_dec_step_deg: 4.0
  label_polar_ra_step_deg: 30.0
  tick_ra_step_deg: 1.25
  tick_dec_step_deg: 1.0
  tick_polar_ra_step_deg: 3.75
label:
  font_family: "Lato"
  star_labels:
    bayer: {enabled: true, max_magnitude: 6.5}
    flamsteed: {enabled: true, max_magnitude: 6.0}
    variables: {enabled: true, max_magnitude: 7.0}
    combined_names: false
    constellation_suffix: {default: true, allow_ambiguity_fallback: false}
  dso_label_magnitude_limit: null
  selection: {medium_density_budget: 0.18, low_density_budget: 0.09}
furniture:
  scale_bar: {enabled: true, length_deg: 2.0}
