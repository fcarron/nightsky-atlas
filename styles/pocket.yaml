# Shared physical print style inherited from Standard; Pocket alters only content density.
extends: standard.yaml
id: pocket
star:
  faint_magnitude: 7.5
  label_magnitude_limit: 4.5
  min_diameter_mm: 0.32
  max_diameter_mm: 5.0
  diameter_curve: [[0.0, 5.0], [1.0, 3.9], [2.0, 3.0], [3.0, 2.25], [4.0, 1.7], [5.0, 1.05], [6.0, 0.65], [7.0, 0.45], [7.5, 0.32]]
double_stars:
  limits:
    - {max_sep_arcsec: 30, max_secondary_mag: 10.5}
    - {max_sep_arcsec: 200, max_secondary_mag: 8.5}
  marker_length_factor: 1.8
  min_marker_length_mm: 0.8
  marker_line_width_mm: 0.15
dso:
  galaxy: {min_diameter_mm: 0.7, min_minor_axis_mm: 1.0}
  globular_cluster: {min_diameter_mm: 1.2}
  planetary_nebula: {min_diameter_mm: 1.2}
  open_cluster: {min_diameter_mm: 1.6}
  bright_nebula: {min_diameter_mm: 1.8}
  dark_nebula: {min_diameter_mm: 1.8}
  galaxy_cluster: {min_diameter_mm: 1.8}
label:
  star_labels:
    proper_names: {core: true, standard: false, extended: false}
    bayer: {enabled: true, max_magnitude: 4.5}
    flamsteed: {enabled: false, max_magnitude: 4.5}
    variables: {enabled: false, max_magnitude: 4.5}
    combined_names: false
    constellation_suffix: {default: true, allow_ambiguity_fallback: false}
  dso_label_magnitude_limit: 10.5
  selection: {medium_density_budget: 0.08, low_density_budget: 0.025}
furniture:
  scale_bar: {length_deg: 10.0}
