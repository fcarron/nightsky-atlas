# Shared physical print style inherited from Standard; Pocket alters only content density.
extends: standard.yaml
id: pocket
star:
  faint_magnitude: 7.5
  label_magnitude_limit: 5.5
  min_diameter_mm: 0.28
  max_diameter_mm: 5.0
  diameter_curve: [[0.0, 5.0], [1.0, 3.9], [2.0, 3.0], [3.0, 2.25], [4.0, 1.7], [5.0, 1.05], [6.0, 0.65], [7.0, 0.42], [7.5, 0.28]]
double_stars:
  limits:
    - {max_sep_arcsec: 30, max_secondary_mag: 10.5}
    - {max_sep_arcsec: 120, max_secondary_mag: 8.5}
    - {max_sep_arcsec: 200, max_secondary_mag: 8.5}
  marker_length_factor: 1.8
  min_marker_length_mm: 0.8
  marker_line_width_mm: 0.15
constellation:
  names:
    font_size_pt: 15.3
    min_visible_area_fraction: 0.10
  lines:
    gray: 0.51
    bold_width_mm: 0.18
    normal_width_mm: 0.12
    thin_width_mm: 0.08
  boundaries:
    enabled: true
    gray: 0.68
    line_width_mm: 0.12
    dash_mm: 0.65
    gap_mm: 0.85
dso:
  galaxy: {min_angular_major_axis_arcmin: 20.0}
  outline_line_width_mm: 0.14
  outline_gray: 0.58
  globular_cluster: {min_angular_size_arcmin: 20.0, min_diameter_mm: 1.2}
  open_cluster: {min_angular_size_arcmin: 20.0, min_diameter_mm: 1.6}
  planetary_nebula: {min_angular_size_arcmin: 20.0, min_diameter_mm: 1.2}
  bright_nebula: {min_angular_size_arcmin: 20.0, min_diameter_mm: 1.8}
  dark_nebula: {min_angular_size_arcmin: 20.0, min_diameter_mm: 1.8}
  galaxy_cluster: {min_angular_size_arcmin: 20.0, min_diameter_mm: 1.8}
grid:
  ra_step_deg: 15.0
  dec_step_deg: 10.0
  polar_ra_step_deg: 30.0
  polar_ra_gray: 0.56
  polar_ra_line_width_mm: 0.12
  label_ra_step_deg: 15.0
  label_dec_step_deg: 10.0
  label_polar_ra_step_deg: 30.0
  tick_ra_step_deg: 3.75
  tick_dec_step_deg: 5.0
  tick_polar_ra_step_deg: 30.0
overview:
  hemispheres_per_page: 2
  equatorial_extension_deg: 18.0
  radius_mm: 76.0
  code_font_size_pt: 9.0
  code_gray: 0.0
  show_grid: false
  grid_gray: 0.94
  constellation_gray: 0.78
  constellation_line_width_mm: 0.18
  boundary_gray: 0.93
  boundary_line_width_mm: 0.08
  show_constellation_names: false
  show_pole_label: false
  footprint_gray: 0.28
  footprint_line_width_mm: 0.25
  show_stars: true
  star_limit_magnitude: 4.0
  star_gray: 0.18
label:
  font_family: "Lato"
  dso_placement:
    label_label_ink_clearance_mm: 0.7
  star_labels:
    proper_names: {core: true, standard: true, extended: false}
    bayer: {enabled: true, max_magnitude: 5.5}
    flamsteed: {enabled: false, max_magnitude: 4.5}
    variables: {enabled: false, max_magnitude: 4.5}
    combined_names: true
    constellation_suffix: {default: false, allow_ambiguity_fallback: true}
  dso_label_magnitude_limit: null
  dso_labels:
    common_name_display: iconic
    common_name_neighbor_radius_mm: 8.0
    common_name_max_neighbors: 5
  selection: {medium_density_budget: 0.08, low_density_budget: 0.025}
furniture:
  scale_bar: {enabled: false, length_deg: 10.0}
milky_way:
  enabled: true
  levels: [1]
  line_width_mm: 0.095
  level_gray: {1: 0.82, 2: 0.80, 3: 0.78, 4: 0.76, 5: 0.74}

magellanic_clouds:
  enabled: true
  levels: [1, 2, 3]
  line_width_mm: 0.10
  level_gray: {1: 0.70, 2: 0.62, 3: 0.54}
  level_fill_gray: {1: 0.97, 2: 0.94, 3: 0.91}
