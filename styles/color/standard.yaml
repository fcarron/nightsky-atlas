extends: ../standard.yaml
milky_way:
  enabled: true
  levels: [1, 3]
  line_width_mm: 0.07
color_atlas:
  background: "#FFFFFF"
  stars: "#17191C"
  labels: "#252525"
  constellation_names: "#92969E"
  constellation_lines: "#748B80"
  coordinate_grid: null
  constellation_boundaries: "#C2C6CA"
  dso:
    galaxies: "#B97A63"
    clusters: "#F5E8A4"
    planetary_nebulae: "#6FB7A6"
    bright_nebulae: "#9AC37A"
    reflection_nebulae: "#8DB6D9"
    dark_nebulae: "#A3978A"
    supernova_remnants: "#9AA8BC"
    other: "#666666"
  dso_fill_white_blend: [0.0, 0.10, 0.22, 0.34]
  galaxy_fill:
    full_fill_until_mm: 2.5
    large_fill_from_mm: 7.0
    large_fill_alpha: 0.18
  schematic_nebula_fill:
    full_fill_until_mm: 3.0
    large_fill_from_mm: 16.0
    large_fill_alpha: 0.08
  milky_way_fills: {1: "#E8F1F8", 3: "#D6E6F3"}
  milky_way_outline: "#D6E3ED"
  open_cluster_fill:
    small_max_diameter_mm: 5.0
    medium_max_diameter_mm: 14.0
    medium_fill_alpha: 0.48
    large_fill_alpha: 0.18
    medium_outline_alpha: 0.82
    large_outline_alpha: 0.62
  magellanic_cloud_fills: {1: "#E8F1F8", 2: "#D6E6F3", 3: "#C4D9EC"}
  magellanic_cloud_fill_alpha: {1: 0.60, 2: 0.60, 3: 0.60}
  magellanic_cloud_outline: "#D6E3ED"
magellanic_clouds:
  line_width_mm: 0.07
