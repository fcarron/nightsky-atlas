# Example manual label override (AGENTS.md section 22).
#
# Overrides reference labels by stable ID and are applied after the initial
# deterministic layout.  A locked placement is preserved by later optimizers,
# and an override also protects its label from the local density selection
# pass.  Use with:
#   nightsky chart render --chart test-virgo --optimize --overrides overrides/test-virgo.yaml
chart: test-virgo
labels:
  label:dso:NGC3842:
    candidate: E
    locked: true
