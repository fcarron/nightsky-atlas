[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightsky-atlas"
version = "0.1.0a1"
description = "Generate publication-quality printable star atlases for visual deep-sky observing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frédéric Carron" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2",
    "pycairo>=1.29",
    "pyyaml>=6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
nightsky = "nightsky_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightsky_atlas = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "__pycache__"]
addopts = "-ra --ignore=build"
markers = [
    "integration: checks locally imported full catalogues or optional stellar stores",
    "slow: fine-resolution full-sky geometry audit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
